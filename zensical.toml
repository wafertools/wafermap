[project]
extra_css   = ["stylesheets/extra.css"]
site_name   = "Wafermap"
site_url    = "https://telecasterer.github.io/wafermap/"
site_author = "Paul Robins"
repo_url    = "https://github.com/telecasterer/wafermap"

nav = [
  { "Home"              = "index.md"      },
  { "Quick Start"       = "quickstart.md" },
  { "End-User Guide"    = "user-guide.md" },
  { "Developer Guide"   = "guide.md"      },
  { "Architecture"      = "architecture.md" },
  { "Pattern Detection" = [
    { "Overview"         = "pattern-detection.md" },
    { "Detection Analysis" = "detection-analysis.md" },
  ]},
  { "API Reference"     = "api.md"        },
  { "Troubleshooting"   = "troubleshooting.md" },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Getting started" = [
      { "Your first wafer map"           = "examples/first-map.html"      },
      { "Loading CSV data"               = "examples/csv-data.html"       },
      { "Geometry inference"             = "examples/geometry.html"       },
      { "Partial data"                   = "examples/partial-data.html" },
      { "Bins and yield"                 = "examples/named-bins.html"     },
      { "Test values"                    = "examples/test-values.html"    },
      { "Retests"                        = "examples/retests.html"        },
    ]},
    { "Interaction and control" = [
      { "Display control"                = "examples/display-control.html" },
      { "Interaction API"                = "examples/interaction.html"     },
      { "Lot gallery"                    = "examples/gallery.html"         },
      { "Web Worker"                     = "examples/worker.html"          },
      { "Custom colour schemes"          = "examples/color-schemes.html"   },
    ]},
    { "Analysis and layout" = [
      { "Statistical findings"           = "examples/findings.html"        },
      { "Summary panel"                  = "examples/summary-panel.html"   },
      { "Lot-level findings"             = "examples/lot-findings.html"    },
      { "Lot-stack spatial analysis"     = "examples/lot-stack-analysis.html" },
      { "Reticle overlays"               = "examples/reticle.html"         },
      { "Multi-site parallel testing"    = "examples/test-sites.html"      },
      { "Real wafer data (WM-811K)"      = "examples/real-data.html"       },
      { "Mixed patterns (MixedWM38)"    = "examples/mixedwm38.html"       },
    ]},
    { "Compatibility and advanced" = [
      { "Rendering pipeline"             = "examples/pipeline.html"        },
    ]},
  ]},
  { "Integration Guides" = [
    { "SvelteKit" = "sveltekit.md" },
    { "React"     = "react.md"     },
    { "Vue 3"     = "vue.md"       },
  ]},
  { "Glossary"          = "glossary.md"   },
]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.sections",
  "content.code.copy",
]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
