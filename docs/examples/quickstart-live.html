<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Start — wafermap</title>
  <link rel="stylesheet" href="demo.css">
  <style>
    /* Base (reset, font stack, ground, tokens, and the --wmap-* handoff to the
       embedded map) comes from demo.css. Only this page's own header bar and
       map sizing below — the palette is the shared one, not a second copy. */
    html, body { height: 100%; }
    header {
      background: var(--text);
      color: var(--surface);
      padding: var(--space-lg) var(--space-xxl);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: var(--space-xl);
    }
    header .logo { font-weight: 700; font-size: 15px; }
    header .logo em { color: var(--accent); font-style: normal; }
    header .sep { width: 1px; height: 16px; background: var(--text-2); }
    header .title { color: var(--muted); }
    header a {
      margin-left: auto;
      color: var(--accent);
      font-size: 12px;
      text-decoration: none;
    }
    header a:hover { text-decoration: underline; }
    #map {
      /* Wide enough to dock the summary panel beside the map rather than
         squeezing it. The panel is a fixed 300px when side-docked, so a 600px
         box left the map 280px — half the width for the wafer this page exists
         to show. 1000px keeps the map the dominant element at ~660px. */
      width: min(1000px, 96vw);
      height: min(620px, 90vh);
      margin: var(--space-xxxl) auto;
      display: block;
    }
    .note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: var(--space-xxxl);
    }
    .note a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <span class="logo">wafer<em>map</em></span>
    <div class="sep"></div>
    <span class="title">Quick Start demo</span>
    <a href="https://wafertools.github.io/wafermap/quickstart/">← Back to Quick Start guide</a>
  </header>

  <div id="map"></div>
  <p class="note">
    Use the toolbar above the map to zoom, rotate, change colour scheme or download a PNG.<br>
    <a href="https://wafertools.github.io/wafermap/quickstart/">Read the Quick Start guide</a>
    to see the code that generated this.
  </p>

  <script type="module">
    import { buildWaferMap }  from '../dist/index.js';
    import { renderWaferMap } from '../dist/packages/canvas-adapter/index.js';
    import { analyzeWaferMap } from '../dist/packages/stats/index.js';

    // The lot this page renders is generated by ./quickstart-data.js, which is
    // also the source the Quick Start page's copy-paste example is checked
    // against (scripts/check-quickstart-snippet.mjs). Importing it rather than
    // repeating it is what stops this page drifting from the code the reader
    // was just shown. To see that code, read the Quick Start.
    import { quickstartResults as results } from './quickstart-data.js';

    // buildWaferMap processes die data into a wafer model. Pure function — no DOM access.
    // passBins tells the library which bin numbers count as passing yield.
    //
    // waferConfig/dieConfig state the physical geometry. They are optional —
    // wmap infers a wafer from the die positions alone — but inference can only
    // produce a *dimensionless* map: correct relative positions, with a made-up
    // diameter and 1×1 dies. Supply them whenever you know them, which for real
    // test data you almost always do. Everything denominated in millimetres
    // (edge exclusion, die pitch, the stated wafer size) depends on it.
    const result = buildWaferMap({
      results,
      passBins: [1],
      waferConfig: { diameter: 300, notch: { type: 'bottom' } },
      dieConfig:   { width: 10, height: 10 },
      hbinDefs: [{ bin: 1, name: 'Pass' }, { bin: 2, name: 'Edge Ring' }],
    });

    // One more call turns the map into an analysis. analyzeWaferMap looks for
    // ring, quadrant, sector and cluster patterns in the yield and bin data and
    // returns them as findings; the summary panel renders them beside the map,
    // and clicking one highlights the dies it covers. On this wafer it should
    // find the edge ring the data above was built with.
    const summary = analyzeWaferMap(result);

    // renderWaferMap mounts an interactive canvas into the container div.
    renderWaferMap(document.getElementById('map'), result, {
      statsSummary: summary,
      summaryPanel: { placement: 'right', defaultOpen: true },
      showHelpButton: true,
    });
  </script>
</body>
</html>
