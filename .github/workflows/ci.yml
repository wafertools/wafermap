name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Reusable: deploy.yml calls this so the docs site is never published from a
  # tree that fails typecheck, tests, or the pack check.
  workflow_call:

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        # Must match the version deploy.yml builds the site with — otherwise the
        # version validated here is not the version actually shipped.
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # check-agents-guide.mjs (part of `npm run check`) verifies AGENTS.md
        # against dist/**/*.d.ts, so dist/ must exist before Typecheck runs —
        # a fresh CI checkout has no local dist/ lying around like a dev machine.
        run: npm run build

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Pack Check
        run: npm run pack:check
