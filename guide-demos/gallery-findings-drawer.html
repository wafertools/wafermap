<!doctype html>
<html>
<head><meta charset="utf-8"><title>Gallery findings drawer demo</title></head>
<body>
  <h3>Gallery with findings drawer open</h3>
  <div id="gallery" style="width:100%; height:1200px;"></div>

  <script type="module">
    import { buildWaferMap } from '../dist/index.js';
    import { renderWaferGallery } from '../dist/packages/canvas-adapter/index.js';
    import { analyzeWaferMap, analyzeWaferLot } from '../dist/packages/stats/index.js';

    function seededNoise(i, j, seed = 1) { const s = Math.sin(i * 127.1 + j * 311.7 + seed * 13.7) * 43758.5453; return s - Math.floor(s); }
    function makeWaferData(seed) {
      const results = [];
      for (let i = -14; i <= 14; i++) for (let j = -14; j <= 14; j++) {
        const r = Math.hypot(i, j);
        if (r > 13) continue;
        // create a repeated ring issue on wafers 0..2 with some noise
        const noise = seededNoise(i, j, seed);
        const passProb = Math.max(0.15, 1 - (r / 13) * 0.9 + (noise - 0.5) * 0.25);
        const rand = seededNoise(i, j, seed * 5 + 11);
        let bin;
        if (Math.floor(r) === 4 && seed < 3) {
          bin = rand < 0.35 ? 1 : 2;
        } else {
          bin = rand < passProb ? 1 : (rand < passProb + 0.12 ? 2 : 3);
        }
        results.push({ x: i, y: j, bins: [bin] });
      }
      return results;
    }

    const waferResults = Array.from({ length: 6 }, (_, idx) => buildWaferMap({ results: makeWaferData(idx), waferConfig: { diameter: 300 }, dieConfig: { width: 10, height: 10 }, passBins: [1] }));

    const waferSummaries = waferResults.map(r => analyzeWaferMap(r, { ringCount: 6, passBins: [1] }));
    const lotSummary = analyzeWaferLot(waferResults, { ringCount: 6 });

    const items = waferResults.map((r,i) => ({ wafer: r.wafer, dies: r.dies, label: `W${i+1}`, statsSummary: waferSummaries[i] }));

    const ctrl = renderWaferGallery(document.getElementById('gallery'), items, { sceneOptions: { plotMode: 'hardbin' }, lotStatsSummary: lotSummary });

    console.log('Lot findings:', lotSummary.findings);
  </script>
</body>
</html>
