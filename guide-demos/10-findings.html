<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistical findings — wafermap guide</title>
  <link rel="stylesheet" href="demo.css">
  <script type="importmap">{ "imports": {
    "wafermap":                "../dist/index.js",
    "wafermap/canvas-adapter": "../dist/packages/canvas-adapter/index.js",
    "wafermap/stats":          "../dist/packages/stats/index.js"
  } }</script>
  <style>
    .finding-row {
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.45;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .12s;
    }
    .finding-row:hover { background: var(--bg); }
    .finding-row .sev  { font-size: 10px; font-weight: 700; letter-spacing:.04em; text-transform:uppercase; }
    .finding-row .sum  { color: var(--text-2); margin-top: 2px; }
    .sev-unusual  { color: #b91c1c; }
    .sev-notable  { color: #c2410c; }
    .sev-info     { color: var(--muted); }
    .finding-row.selected { background: var(--accent-lo); border-color: var(--accent); }
  </style>
</head>
<body class="demo-page">

  <header class="demo-header">
    <span class="demo-logo">wafer<em>map</em></span>
    <div class="demo-sep"></div>
    <span class="demo-title">§10 — Statistical findings</span>
    <span class="demo-desc">
      analyzeWaferMap detects yield loss concentrated in rings, quadrants, or reticle positions
    </span>
  </header>

  <div class="demo-content">

    <div class="canvas-card flex-1">
      <canvas id="map"></canvas>
    </div>

    <div class="demo-panel" style="width:280px">
      <div class="demo-panel-scroll">

        <div class="section">
          <div class="section-heading">Analysis summary</div>
          <div class="stats-grid">
            <div class="stat">
              <div class="stat-val" id="stat-yield">—</div>
              <div class="stat-lbl">Overall yield</div>
            </div>
            <div class="stat">
              <div class="stat-val" id="stat-findings">—</div>
              <div class="stat-lbl">Findings</div>
            </div>
          </div>
          <table class="kv" style="margin-top:4px">
            <tr><td>Analyzed dies</td> <td id="meta-analyzed">—</td></tr>
            <tr><td>Ring count</td>    <td id="meta-rings">—</td></tr>
          </table>
        </div>

        <div class="section-divider"></div>

        <div class="section">
          <div class="section-heading">Findings (click to highlight dies)</div>
          <div id="findings-list" style="display:flex; flex-direction:column; gap:4px"></div>
        </div>

      </div>
    </div>

  </div>

  <script type="module">
    import { buildWaferMap }   from 'wafermap';
    import { renderWaferMap }  from 'wafermap/canvas-adapter';
    import { analyzeWaferMap } from 'wafermap/stats';
    import { makeResults, WAFER_CONFIG, DIE_CONFIG, HBIN_DEFS, SBIN_DEFS, TEST_DEFS } from './data.js';

    // A wafer with deliberate spatial patterns: edge ring yield loss + NE quadrant drift.
    // These are chosen because they are large enough to be detected by the stats engine.
    const result = buildWaferMap({
      results:     makeResults({ seed: 13, edgeFail: true, quadrant: true }),
      waferConfig: WAFER_CONFIG,
      dieConfig:   DIE_CONFIG,
      hbinDefs:    HBIN_DEFS,
      sbinDefs:    SBIN_DEFS,
      testDefs:    TEST_DEFS,
      passBins:    [1],
    });

    const RING_COUNT = 4;

    // analyzeWaferMap scans every ring, quadrant, and bin combination,
    // applying BH-adjusted p-value and a minimum effect size filter.
    const summary = analyzeWaferMap(result, {
      ringCount:       RING_COUNT,
      passBins:        [1],
      minimumEffectSize: 0.08, // slightly relaxed threshold to show more findings
    });

    // Populate summary stats
    const yld = result.yield;
    document.getElementById('stat-yield').textContent =
      yld.yieldPercent != null ? `${(yld.yieldPercent * 100).toFixed(1)}%` : '—';
    document.getElementById('stat-findings').textContent = summary.findings.length;
    document.getElementById('meta-analyzed').textContent = summary.metadata.analyzedDies;
    document.getElementById('meta-rings').textContent    = RING_COUNT;

    // Mount the map — pass the StatsSummary to get the built-in findings panel too
    const ctrl = renderWaferMap(document.getElementById('map'), result.wafer, result.dies, {
      sceneOptions: {
        plotMode:  'hardbin',
        hbinDefs:  HBIN_DEFS,
        sbinDefs:  SBIN_DEFS,
        testDefs:  result.scene.testDefs,
        ringCount: RING_COUNT,
      },
      statsSummary: summary, // adds the clipboard icon to the built-in toolbar
    });

    // Render the findings list in the side panel
    const listEl = document.getElementById('findings-list');

    const sevLabel  = { unusual: 'Unusual', notable: 'Notable', info: 'Info' };
    const sevClass  = { unusual: 'sev-unusual', notable: 'sev-notable', info: 'sev-info' };

    let activeFinding = null;

    for (const finding of summary.findings) {
      const row = document.createElement('div');
      row.className = 'finding-row';
      row.innerHTML = `
        <div class="sev ${sevClass[finding.severity]}">${sevLabel[finding.severity]}</div>
        <div class="sum">${finding.summary}</div>`;

      row.addEventListener('click', () => {
        // Toggle off if already selected
        if (activeFinding === finding) {
          activeFinding = null;
          row.classList.remove('selected');
          ctrl.clearSelection();
          ctrl.setOptions({ highlightBin: undefined, showRingBoundaries: false, showQuadrantBoundaries: false });
          return;
        }
        listEl.querySelectorAll('.finding-row').forEach(r => r.classList.remove('selected'));
        activeFinding = finding;
        row.classList.add('selected');

        // Switch to the most relevant display mode for this finding
        const kind = finding.variable.kind;
        if (kind === 'test') {
          ctrl.setOptions({ plotMode: 'value', testIndex: finding.variable.index ?? 0 });
        } else if (kind === 'hardbin') {
          ctrl.setOptions({ plotMode: 'hardbin', highlightBin: finding.variable.bin });
        } else {
          ctrl.setOptions({ plotMode: 'hardbin', highlightBin: undefined });
        }

        // Show zone boundaries for context
        const fam = finding.comparison.family;
        ctrl.setOptions({
          showRingBoundaries:     fam === 'ring',
          showQuadrantBoundaries: fam === 'quadrant',
        });

        // Select the specific dies flagged by this finding — the stat engine
        // sets finding.highlight.dieKeys to the affected die positions.
        const dieKeys = finding.highlight.dieKeys;
        if (dieKeys?.length) {
          const keySet = new Set(dieKeys);
          const affected = result.dies.filter(d => keySet.has(`${d.i},${d.j}`));
          ctrl.setSelection(affected);
        } else {
          ctrl.clearSelection();
        }
      });

      listEl.appendChild(row);
    }

    if (summary.findings.length === 0) {
      listEl.innerHTML = '<div class="info-box"><span class="empty">No significant findings detected</span></div>';
    }
  </script>

</body>
</html>
