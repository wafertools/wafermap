<!doctype html>
<html>
<head><meta charset="utf-8"><title>Findings panel demo</title></head>
<body>
  <h3>Findings panel with a highlighted ring</h3>
  <style>
    .wmap-demo-wrapper { display:inline-block; position:relative; }
    [data-wmap-toolbar] { right: auto !important; left: 4px !important; top: 4px !important; }
    [data-wmap-findings-panel] { right: auto !important; left: 4px !important; top: 40px !important; }
  </style>

  <div class="wmap-demo-wrapper" style="width:740px;">
    <canvas id="map" style="width:700px; height:700px; border:1px solid #ccc; display:block"></canvas>
  </div>

  <script type="module">
    import { buildWaferMap } from '../dist/index.js';
    import { renderWaferMap } from '../dist/packages/canvas-adapter/index.js';
    import { analyzeWaferMap } from '../dist/packages/stats/index.js';

    const results = [];
    function seededNoise(i, j, seed = 1) { const s = Math.sin(i * 127.1 + j * 311.7 + seed * 13.7) * 43758.5453; return s - Math.floor(s); }
    for (let i = -16; i <= 16; i++) {
      for (let j = -16; j <= 16; j++) {
        const r = Math.hypot(i, j);
        if (r > 15) continue;
        const noise = seededNoise(i, j, 9);
        const passProb = Math.max(0.15, 1 - (r / 15) * 0.9 + (noise - 0.5) * 0.3);
        const rand = seededNoise(i, j, 123);
        // Make ring 3 slightly low-yield
        let bin;
        if (Math.floor(r) === 3) {
          bin = rand < 0.35 ? 1 : 2;
        } else {
          bin = rand < passProb ? 1 : (rand < passProb + 0.12 ? 2 : 3);
        }
        results.push({ x: i, y: j, hbin: bin });
      }
    }

    const result = buildWaferMap({ results, waferConfig: { diameter: 300 }, dieConfig: { width: 10, height: 10 }, passBins: [1] });
    const summary = analyzeWaferMap(result, { ringCount: 6, passBins: [1] });

    const ctrl = renderWaferMap(document.getElementById('map'), result.wafer, result.dies, { statsSummary: summary });

    console.log('Findings:', summary.findings);
  </script>
</body>
</html>
