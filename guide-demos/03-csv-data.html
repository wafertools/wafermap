<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading CSV data — wafermap guide</title>
  <link rel="stylesheet" href="demo.css">
  <script type="importmap">{ "imports": {
    "wafermap":                "../dist/index.js",
    "wafermap/canvas-adapter": "../dist/packages/canvas-adapter/index.js"
  } }</script>
</head>
<body class="demo-page">

  <header class="demo-header">
    <span class="demo-logo">wafer<em>map</em></span>
    <div class="demo-sep"></div>
    <span class="demo-title">§3 — Loading real data from a CSV</span>
    <span class="demo-desc">Parse CSV rows → DieResult[] → buildWaferMap</span>
  </header>

  <!-- Wafer selector and file info -->
  <div class="demo-controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Wafer</span>
      <select id="sel-wafer"></select>
    </div>
    <div class="ctrl-sep"></div>
    <span id="file-info" style="font-size:12px; color:var(--muted)">Loading…</span>
  </div>

  <div class="demo-content">

    <div class="canvas-card flex-1">
      <canvas id="map"></canvas>
    </div>

    <div class="demo-panel">
      <div class="demo-panel-scroll">

        <div class="section">
          <div class="section-heading">Source file</div>
          <table class="kv">
            <tr><td>Lot</td>      <td id="meta-lot">—</td></tr>
            <tr><td>Wafer</td>    <td id="meta-wafer">—</td></tr>
            <tr><td>Rows</td>     <td id="meta-rows">—</td></tr>
            <tr><td>Test date</td><td id="meta-date">—</td></tr>
            <tr><td>Temp</td>     <td id="meta-temp">—</td></tr>
          </table>
        </div>

        <div class="section-divider"></div>

        <div class="section">
          <div class="section-heading">Yield</div>
          <div class="stats-grid">
            <div class="stat full">
              <div class="stat-val" id="stat-yield">—</div>
              <div class="stat-lbl">Yield (Hard Bin 1)</div>
            </div>
            <div class="stat">
              <div class="stat-val" id="stat-pass">—</div>
              <div class="stat-lbl">Pass dies</div>
            </div>
            <div class="stat">
              <div class="stat-val" id="stat-total">—</div>
              <div class="stat-lbl">Total dies</div>
            </div>
          </div>
        </div>

        <div class="section-divider"></div>

        <div class="section">
          <div class="section-heading">Columns detected</div>
          <div class="info-box" id="cols-box" style="font-family:monospace; font-size:11px; line-height:1.7"></div>
        </div>

      </div>
    </div>

  </div>

  <script type="module">
    import { buildWaferMap }  from 'wafermap';
    import { renderWaferMap } from 'wafermap/canvas-adapter';

    // ── Minimal CSV parser — no external library needed for demo data ─────────
    function parseCsv(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      return lines.slice(1).map(line => {
        const vals = line.split(',');
        return Object.fromEntries(headers.map((h, i) => [h, (vals[i] ?? '').trim()]));
      });
    }

    // Load the bundled demo CSV (columns: lot,wafer,x,y,hbin,sbin,testdate,temp,testA,testB,testC)
    const csvText = await fetch('../data/dummy-fulldata.csv').then(r => r.text());
    const allRows = parseCsv(csvText);
    const waferIds = [...new Set(allRows.map(r => r.wafer))];

    const sel = document.getElementById('sel-wafer');
    for (const id of waferIds) {
      const opt = document.createElement('option');
      opt.value = opt.textContent = id;
      sel.appendChild(opt);
    }

    document.getElementById('file-info').textContent =
      `${allRows.length} rows · ${waferIds.join(', ')}`;

    // Show the column names so readers can see what the CSV contains
    const headers = Object.keys(allRows[0]);
    document.getElementById('cols-box').textContent = headers.join('\n');

    let ctrl; // keep a handle so we can replace the canvas on wafer change

    function render(waferId) {
      // Filter to the selected wafer's rows
      const rows = allRows.filter(r => r.wafer === waferId);

      // Map CSV rows to DieResult — x/y are prober step positions, not mm
      const results = rows.map(r => ({
        x:      Number(r.x),
        y:      Number(r.y),
        bins:   [Number(r.hbin), Number(r.sbin)],
        values: [Number(r.testA), Number(r.testB), Number(r.testC)],
      }));

      const waferMeta = {
        lot:      rows[0]?.lot,
        wafer:    waferId,
        testDate: rows[0]?.testdate,
        temp:     rows[0]?.temp ? `${rows[0].temp} °C` : '—',
      };

      // buildWaferMap infers geometry when none is supplied —
      // pass dieConfig so coordinates are in real mm
      const result = buildWaferMap({
        results,
        waferConfig: {
          diameter: 300,
          notch:    { type: 'bottom' },
          metadata: waferMeta,
        },
        dieConfig: { width: 10, height: 10 },
        passBins:  [1],
      });

      // Update sidebar
      document.getElementById('meta-lot').textContent   = waferMeta.lot   ?? '—';
      document.getElementById('meta-wafer').textContent = waferId;
      document.getElementById('meta-rows').textContent  = rows.length;
      document.getElementById('meta-date').textContent  = waferMeta.testDate ?? '—';
      document.getElementById('meta-temp').textContent  = waferMeta.temp;

      const yld = result.yield;
      document.getElementById('stat-yield').textContent =
        yld.yieldPercent != null ? `${(yld.yieldPercent * 100).toFixed(1)}%` : '—';
      document.getElementById('stat-pass').textContent  = yld.passDies;
      document.getElementById('stat-total').textContent = yld.totalDies;

      // Mount or replace the canvas renderer
      if (ctrl) ctrl.destroy();
      ctrl = renderWaferMap(document.getElementById('map'), result.wafer, result.dies, {
        sceneOptions: { plotMode: 'hardbin' },
      });
    }

    render(waferIds[0]);

    document.getElementById('sel-wafer').addEventListener('change', e => render(e.target.value));
  </script>

</body>
</html>
