<!doctype html>
<html>
<head><meta charset="utf-8"><title>Value mode — Idsat colorbar demo</title></head>
<body>
  <style>
    .wmap-demo-wrapper { display:inline-block; position:relative; }
    [data-wmap-toolbar] { right: auto !important; left: 4px !important; top: 4px !important; }
    [data-wmap-findings-panel] { right: auto !important; left: 4px !important; top: 40px !important; }
  </style>
  <div class="wmap-demo-wrapper" style="width:740px;">
    <canvas id="map" style="width:700px; height:700px; border:1px solid #ccc; display:block"></canvas>
  </div>

  <script type="module">
    import { buildWaferMap } from '../dist/index.js';
    import { renderWaferMap } from '../dist/packages/canvas-adapter/index.js';

    const results = [];
    function seededNoise(i, j, seed = 1) { const s = Math.sin(i * 127.1 + j * 311.7 + seed * 13.7) * 43758.5453; return s - Math.floor(s); }
    for (let i = -14; i <= 14; i++) {
      for (let j = -14; j <= 14; j++) {
        const r = Math.hypot(i, j);
        if (r > 13) continue;
        const angle = Math.atan2(j, i);
        const noise = seededNoise(i, j, 5);
        const idsat = (1 + Math.cos(angle) * 0.5) * Math.exp(-r / 8) * (0.5 + noise * 1.2) * 2e-3; // amps with noise
        results.push({ x: i, y: j, values: [idsat] });
      }
    }

    const { wafer, dies, scene } = buildWaferMap({
      results,
      dieConfig: { width: 10, height: 10 },
      waferConfig: { diameter: 300 },
      testDefs: [{ index: 0, name: 'Idsat', unit: 'A' }],
    });

    renderWaferMap(document.getElementById('map'), wafer, dies, { sceneOptions: { plotMode: 'value', testIndex: 0, testDefs: scene.testDefs } });
  </script>
</body>
</html>
