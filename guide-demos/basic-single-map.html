<!doctype html>
<html>
<head><meta charset="utf-8"><title>Basic wafer map — demo</title></head>
<body>
  <h3>Basic wafer map (toolbar on hover)</h3>
  <style>
    .wmap-demo-wrapper { display:inline-block; position:relative; }
    /* Force the built-in toolbar and findings panel to the left of the canvas */
    [data-wmap-toolbar] { right: auto !important; left: 4px !important; top: 4px !important; }
    [data-wmap-findings-panel] { right: auto !important; left: 4px !important; top: 40px !important; }
  </style>

  <div class="wmap-demo-wrapper" style="width:640px;">
    <canvas id="map" style="width:600px; height:600px; border:1px solid #ccc; display:block"></canvas>
  </div>

  <script type="module">
    import { buildWaferMap } from '../dist/index.js';
    import { renderWaferMap } from '../dist/packages/canvas-adapter/index.js';

    // generate grid results with more realistic, noisy distributions inspired by examples
    const results = [];
    function seededNoise(i, j, seed = 1) {
      const s = Math.sin(i * 127.1 + j * 311.7 + seed * 13.7) * 43758.5453;
      return s - Math.floor(s);
    }

    for (let i = -14; i <= 14; i++) {
      for (let j = -14; j <= 14; j++) {
        const r = Math.hypot(i, j);
        if (r > 14) continue;
        // base probabilities: center high-pass, mid rings mixed, edge higher failure
        const noise = seededNoise(i, j, 7);
        const passProb = Math.max(0.2, 1 - (r / 14) * 0.9 + (noise - 0.5) * 0.25);
        const rand = seededNoise(i, j, 42);
        const bin = rand < passProb ? 1 : (rand < passProb + 0.12 ? 2 : (rand < passProb + 0.22 ? 3 : 4));
        results.push({ x: i, y: j, bins: [bin] });
      }
    }

    const { wafer, dies } = buildWaferMap({
      results,
      waferConfig: { diameter: 300, notch: { type: 'bottom' } },
      dieConfig: { width: 10, height: 10 },
    });

    renderWaferMap(document.getElementById('map'), wafer, dies);
  </script>
</body>
</html>
