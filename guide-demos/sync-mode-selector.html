<!doctype html>
<html>
<head><meta charset="utf-8"><title>External mode selector sync demo</title></head>
<body>
  <h3>External mode selector synced to toolbar</h3>
  <div>
    <label>Mode: <select id="mode"><option value="hardbin">Hardbin</option><option value="value">Value</option></select></label>
    <label>Test: <select id="test"><option value="0">Idsat</option></select></label>
  </div>
  <style>
    .wmap-demo-wrapper { display:inline-block; position:relative; }
    [data-wmap-toolbar] { right: auto !important; left: 4px !important; top: 4px !important; }
    [data-wmap-findings-panel] { right: auto !important; left: 4px !important; top: 40px !important; }
  </style>
  <div>
    <label>Mode: <select id="mode"><option value="hardbin">Hardbin</option><option value="value">Value</option></select></label>
    <label>Test: <select id="test"><option value="0">Idsat</option></select></label>
  </div>
  <div class="wmap-demo-wrapper" style="width:740px;">
    <canvas id="map" style="width:700px; height:700px; border:1px solid #ccc; display:block"></canvas>
  </div>

  <script type="module">
    import { buildWaferMap } from '../dist/index.js';
    import { renderWaferMap } from '../dist/packages/canvas-adapter/index.js';

    // small dataset with both bins and values
    const results = [];
    function seededNoise(i, j, seed = 1) { const s = Math.sin(i * 127.1 + j * 311.7 + seed * 13.7) * 43758.5453; return s - Math.floor(s); }
    for (let i = -12; i <= 12; i++) {
      for (let j = -12; j <= 12; j++) {
        const r = Math.hypot(i, j);
        if (r > 12) continue;
        const noise = seededNoise(i, j, 3);
        const bin = noise + (r/12) > 0.6 ? 2 : 1;
        const idsat = (2 - r / 12) * (0.5 + ((i % 3) * 0.1 + (noise-0.5)*0.4)) * 1e-3;
        results.push({ x: i, y: j, hbin: bin, values: [idsat] });
      }
    }

    const { wafer, dies, scene } = buildWaferMap({ results, dieConfig: { width: 10, height: 10 }, waferConfig: { diameter: 300 }, testDefs: [{ index: 0, name: 'Idsat', unit: 'A' }] });

    const ctrl = renderWaferMap(document.getElementById('map'), wafer, dies, { sceneOptions: { plotMode: 'hardbin', testDefs: scene.testDefs } });

    const modeSelect = document.getElementById('mode');
    const testSelect = document.getElementById('test');

    if (ctrl.getOptions && typeof ctrl.getOptions === 'function') {
      setInterval(() => {
        const opts = ctrl.getOptions();
        if (opts) {
          modeSelect.value = opts.plotMode || 'hardbin';
          if (opts.testIndex !== undefined) testSelect.value = String(opts.testIndex);
        }
      }, 300);
    }

    modeSelect.addEventListener('change', () => ctrl.setOptions({ plotMode: modeSelect.value }));
    testSelect.addEventListener('change', () => ctrl.setOptions({ testIndex: Number(testSelect.value), plotMode: 'value' }));
  </script>
</body>
</html>
